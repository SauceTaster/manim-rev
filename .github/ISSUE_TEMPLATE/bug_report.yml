name: Bug report
description: Report reproducible incorrect behavior in the library or an adapter
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Manim Rev. For security issues, stop here and follow `SECURITY.md`.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain a vulnerability, secret, or private data.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the complete exception when relevant?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest scene or adapter input that reproduces the problem.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Manim Rev, Manim Community Edition, and Python versions
      placeholder: "manim-rev 0.1.0; Manim CE 0.20.1; Python 3.12.3"
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Cairo
        - OpenGL
        - Both
        - Unknown or not applicable
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Ubuntu 24.04, macOS 15, or Windows 11"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, or a short render. Remove secrets and private data first.
